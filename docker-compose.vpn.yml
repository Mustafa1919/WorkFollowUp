# docker-compose.server.yml uzerine eklenir. Yalniz VPN/test kullanimi.
services:
  backend:
    environment:
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_USER: ""
      SMTP_PASSWORD: ""
      SMTP_AUTH: "false"
      SMTP_STARTTLS: "false"
    depends_on:
      mailpit:
        condition: service_healthy
  mailpit:
    extends:
      file: docker-compose.yml
      service: mailpit
    ports: !override
      - "127.0.0.1:8025:8025"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
