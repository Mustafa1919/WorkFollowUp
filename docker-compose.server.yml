# Tek basina kullanilir; GHCR veya uygulama registry'si gerektirmez.
# docs/DEPLOYMENT_REGISTRY_OLMADAN.md
name: workfollowup-server

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-app-env: &app-env
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: tracker

services:
  postgres:
    extends:
      file: docker-compose.yml
      service: postgres
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: ${DB_MIGRATOR_PASSWORD:?required}
    restart: unless-stopped
    logging: *logging

  redis:
    extends:
      file: docker-compose.yml
      service: redis
    ports: !reset []
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?required}", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
    restart: unless-stopped
    logging: *logging

  kafka:
    extends:
      file: docker-compose.yml
      service: kafka
    ports: !reset []
    environment:
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
    volumes:
      - kafka-data:/var/lib/kafka/data
    restart: unless-stopped
    logging: *logging

  migrate:
    build: .
    image: workfollowup-backend:${IMAGE_TAG:?required}
    pull_policy: never
    environment:
      <<: *app-env
      DB_USER: app_migrator
      DB_PASSWORD: ${DB_MIGRATOR_PASSWORD:?required}
      SPRING_PROFILES_ACTIVE: migrate
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    logging: *logging

  backend:
    image: workfollowup-backend:${IMAGE_TAG:?required}
    pull_policy: never
    environment:
      <<: *app-env
      DB_USER: app_runtime
      DB_PASSWORD: ${DB_RUNTIME_PASSWORD:?required}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      SPRING_PROFILES_ACTIVE: prod
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:?required}
      CORS_ALLOWED_ORIGINS: ${APP_PUBLIC_URL:?required}
      SYSTEM_ADMIN_EMAILS: ${SYSTEM_ADMIN_EMAILS:-}
      WEBHOOK_SECRET_MASTER_KEY: ${WEBHOOK_SECRET_MASTER_KEY:?required}
      JWT_PRIVATE_KEY_LOCATION: file:/etc/tracker/jwt/private.pem
      JWT_PUBLIC_KEY_LOCATION: file:/etc/tracker/jwt/public.pem
      SMTP_HOST: ${SMTP_HOST:?required}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:?required}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?required}
      SMTP_FROM: ${SMTP_FROM:?required}
      SMTP_AUTH: "true"
      SMTP_STARTTLS: "true"
    volumes:
      - ./deploy/jwt:/etc/tracker/jwt:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 1536m
    logging: *logging

  frontend:
    build: ./frontend
    image: workfollowup-frontend:${IMAGE_TAG:?required}
    pull_policy: never
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - backend
    restart: unless-stopped
    mem_limit: 256m
    logging: *logging

volumes:
  postgres-data:
  redis-data:
  kafka-data:
