server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Surum bilgisi Server basligina yazilmaz (CFG-05).
    server_tokens off;

    # Guvenlik basliklari deploy/Caddyfile ile AYNI (FE-01/02): Caddy onunde oldugunda onun degeri
    # gecerli olur, bu container dogrudan acildiginda da koruma kalir. connect-src 'self' ayni
    # origin'deki ws:/wss: baglantisini da kapsar (CSP 3). location bloklari kendi add_header'ini
    # tanimlamadigi icin bunlari devralir.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'sha256-qxFfF27k4Zc2A6eBkmF8JizPkh0CKBGswlC3UB1KHcc='; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;

    # Vite dev proxy'sinin karsiligi: API ve actuator backend'e, ayni origin'den.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    location /actuator/ {
        proxy_pass http://backend:8080;
    }

    # STOMP/WebSocket (bkz. vite.config.ts'in dev proxy'si — bu container'daki karsiligi):
    # backend SockJS kullanmiyor (WebSocketConfig javadoc'u), dogrudan HTTP Upgrade gerekiyor.
    # proxy_read_timeout uzun tutuldu: sunucu heartbeat gondermiyor (SimpleBroker taskScheduler'siz),
    # varsayilan 60sn'lik nginx zaman asimi trafiksiz bir baglantiyi erken keserdi.
    location /ws/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # SPA: bilinmeyen yollar index.html'e duser (react-router).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
