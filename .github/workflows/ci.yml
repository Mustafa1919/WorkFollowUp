name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Trunk-based development: main her zaman deploy edilebilir olmali (PHASE_0, Bolum 3).
# Ayni ref icin eski bir calisma varsa iptal edilir (gereksiz kaynak tuketimini onler).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify:
    name: Build, Test & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Format check (Spotless)
        run: ./mvnw -B spotless:check

      # Birim + entegrasyon testleri. Testcontainers, runner'in Docker daemon'ini
      # kullanarak gercek Postgres + Kafka ayaga kaldirir (PHASE_0, Bolum 3, madde 3).
      - name: Test (unit + Testcontainers integration)
        run: ./mvnw -B verify

      - name: Static analysis (SpotBugs)
        run: ./mvnw -B spotbugs:check

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: surefire-failsafe-reports
          path: |
            target/surefire-reports
            target/failsafe-reports
          retention-days: 7

  dependency-check:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest
    # Varsayilan 6 saat: NVD takilirsa runner saatlerce bos bekliyordu (run #8: 40+ dk, iptal).
    # 75 dk: cache BOSKEN tam NVD indirmesi NVD yavas gunlerde ~40 dk (2026-09-21: 2000 kayit/14 sn);
    # 30 dk'da kesilince cache hic kaydedilmiyor, her kosu yine sifirdan basliyordu (run #10).
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # NVD veritabani (~300 bin CVE) her kosuda sifirdan inmesin: son kosunun verisi geri yuklenir,
      # dependency-check yalniz degisen kayitlari ceker. Anahtar run_id'ye bagli, boylece her basarili
      # kosu guncel veriyi yeni bir cache girdisi olarak kaydeder (actions/cache girdileri degismez).
      - name: Cache NVD database
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ runner.os }}-${{ github.run_id }}
          restore-keys: nvd-${{ runner.os }}-

      # NVD_API_KEY zorunlu: anahtar olmadan NVD API agir rate-limit uygular, ilk
      # calisma saatler surebilir. Ucretsiz anahtar: https://nvd.nist.gov/developers/request-an-api-key
      - name: Dependency vulnerability scan
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          # Anahtar bossa (secret tanimli degil / fork PR'i) NVD verisini saatlerce yavas indirip
          # takili kalmak yerine hemen ve acik bir mesajla dus.
          if [ -z "$NVD_API_KEY" ]; then
            echo "::error::NVD_API_KEY secret'i bos. Repo Settings > Secrets and variables > Actions altina ekleyin."
            exit 1
          fi
          ./mvnw -B dependency-check:check -DnvdApiKey="$NVD_API_KEY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html
          retention-days: 30

  migration-check:
    name: Flyway Migration Doğrulaması
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tracker_ci
          POSTGRES_USER: app_migrator
          POSTGRES_PASSWORD: app_migrator
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app_migrator -d tracker_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # "Temiz kurulum": tum migration'lar bos bir semaya karsi uygulanir.
      # NOT: Faz1 henuz migration dosyasi eklemedi; bu adim su an sifir
      # migration'la trivially gecer. Faz1'de migration'lar eklendikce
      # gercek anlamda calismaya baslayacak (PHASE_0, Bolum 3, madde 5).
      - name: Clean install migration check
        run: ./mvnw -B flyway:migrate

  docker-build-scan:
    name: Docker Image Build & Scan
    runs-on: ubuntu-latest
    needs: [verify, secret-scan]
    # Yalniz okuma: GHCR yazma yetkisi asagidaki publish job'unda, yalniz main push'unda (SC-04).
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build image
        run: docker build -t tracker:${{ github.sha }} .

      # Trivy: bilinen imaj zafiyetlerini tarar (PHASE_0, Bolum 3, madde 4).
      - name: Scan image (Trivy)
        # Commit SHA'ya sabit (v0.36.0): etiket tasinabilir, SHA tasinamaz. Eski "0.28.0" etiketi
        # yoktu (dogrusu "v0.28.0") ve job "Set up job" adiminda dusuyordu.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: tracker:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: '1'

      # Taranan imajin KENDISI publish job'una tasinir (yeniden build edilseydi pushlanan imaj
      # taranandan farkli olabilirdi).
      - name: Save scanned image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save "tracker:${{ github.sha }}" -o tracker-image.tar

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: tracker-image
          path: tracker-image.tar
          retention-days: 1

  publish:
    name: Publish Image (GHCR)
    runs-on: ubuntu-latest
    needs: [docker-build-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tracker-image

      - name: Load scanned image
        run: docker load -i tracker-image.tar

      # Sadece main'e merge sonrasi, commit SHA etiketiyle GHCR'a pushlanir.
      # `latest` etiketi hicbir zaman kullanilmaz (PHASE_0, Bolum 2).
      - name: Push to GHCR
        # Docker imaj adlari KUCUK harf olmak zorunda; repository_owner "Mustafa1919" gibi buyuk harf
        # icerebilir ("repository name must be lowercase"), bu yuzden ${OWNER,,} ile kucultulur.
        # Degerler script'e dogrudan gomulmez, env ile verilir (script injection'a karsi).
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
        run: |
          IMAGE="ghcr.io/${OWNER,,}/tracker:${SHA}"
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          docker tag "tracker:${SHA}" "$IMAGE"
          docker push "$IMAGE"
