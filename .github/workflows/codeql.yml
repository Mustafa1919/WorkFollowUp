name: CodeQL

# SAST (SC-06): Java backend ve frontend TS/JS icin GitHub CodeQL. Sonuclar Security > Code scanning
# altinda gorunur. Haftalik kosu, kod degismese de yeni sorgu paketlerinin buldugunu yakalar.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # build-mode none: Java'yi Maven build'i olmadan kaynaktan cozumler; build'li moda gore
        # biraz daha az kesin ama Testcontainers/Docker gerektirmez ve dakikalar icinde biter.
        language: [java-kotlin, javascript-typescript]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
