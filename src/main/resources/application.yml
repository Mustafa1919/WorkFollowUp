spring:
  application:
    name: tracker

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tracker}
    username: ${DB_USER:app_runtime}
    password: ${DB_PASSWORD:app_runtime}

  flyway:
    enabled: false # Migration'lar ayrı bir Kubernetes Job olarak koşar (bkz. PHASE_0), uygulama startup'ında çalışmaz.

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      # PHASE_2_DETAILED_DESIGN.md Bolum 3.2 — bozuk mesaj deserializer seviyesinde patlarsa
      # error handler'a hic ulasmadan sonsuz donguye girer; ErrorHandlingDeserializer delegate'i
      # sarar ve hatayi KafkaConsumerConfig'teki DefaultErrorHandler'a duzgunce iletir.
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.apache.kafka.common.serialization.StringDeserializer

app:
  datasource:
    # Analitik okumalar icin (@ReadReplica) ayri havuz. Bos url = ayri havuz YOK, okuma da yazma
    # havuzunu kullanir (bkz. ReadReplicaProperties). Gercek replica Faz4/5'te baglanacak.
    read:
      url: ${DB_READ_URL:}
      username: ${DB_READ_USER:}
      password: ${DB_READ_PASSWORD:}
  jwt:
    # DEV-ONLY anahtarlar (bkz. JwtKeyProvider) — staging/prod bu iki degiskeni gercek
    # anahtarlarina (K8s secret dosya yolu) isaret edecek sekilde override eder.
    private-key-location: ${JWT_PRIVATE_KEY_LOCATION:classpath:keys/dev-jwt-private.pem}
    public-key-location: ${JWT_PUBLIC_KEY_LOCATION:classpath:keys/dev-jwt-public.pem}
    access-token-ttl: PT15M
    refresh-token-ttl: P7D
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  webhook:
    # DEV-ONLY varsayilan (public repoda): staging/prod'da WebhookSecretService bu degerle (veya
    # 32 karakterden kisa bir degerle) acilisi REDDEDER — gercek deger WEBHOOK_SECRET_MASTER_KEY.
    secret-master-key: ${WEBHOOK_SECRET_MASTER_KEY:dev-webhook-master-key-not-a-secret-0000}
    max-body-size: 512KB
    integration-cache-ttl: PT60S
    send-timeout: PT2S
  notification:
    # Slack cikis bildirimi (SlackProperties). Devre kesici tek ve globaldir; retry YOK (Kafka
    # error handler zincirdeki tek retry sorumlusu).
    slack:
      connect-timeout: PT2S
      read-timeout: PT5S
      sliding-window-size: 20
      minimum-number-of-calls: 5
      failure-rate-threshold: 50
      open-state-duration: PT30S
      permitted-calls-in-half-open-state: 3
  security:
    # SystemAdminProperties javadoc'u — bu listedeki e-postalar ilk girişte SYSTEM_ADMIN olarak
    # isaretlenir (DB'deki bayrak kalici gercek kaynaktir, buradan çıkarmak geri almaz).
    system-admin-emails: ${SYSTEM_ADMIN_EMAILS:}

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,redis
        liveness:
          include: livenessState
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true
