spring:
  application:
    name: tracker

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tracker}
    username: ${DB_USER:app_runtime}
    password: ${DB_PASSWORD:app_runtime}

  flyway:
    enabled: false # Migration'lar ayrı bir Kubernetes Job olarak koşar (bkz. PHASE_0), uygulama startup'ında çalışmaz.

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

app:
  jwt:
    # DEV-ONLY anahtarlar (bkz. JwtKeyProvider) — staging/prod bu iki degiskeni gercek
    # anahtarlarina (K8s secret dosya yolu) isaret edecek sekilde override eder.
    private-key-location: ${JWT_PRIVATE_KEY_LOCATION:classpath:keys/dev-jwt-private.pem}
    public-key-location: ${JWT_PUBLIC_KEY_LOCATION:classpath:keys/dev-jwt-public.pem}
    access-token-ttl: PT15M
    refresh-token-ttl: P7D
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,redis
        liveness:
          include: livenessState
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true
